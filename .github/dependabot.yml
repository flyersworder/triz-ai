version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    # litellm >=1.104 requires filelock<4. filelock is only transitive, so a
    # major bump can still resolve -- by silently downgrading litellm to the
    # last release without that cap (#59 took litellm 1.104.2 -> 1.103.7). The
    # lockfile stays consistent, so CI cannot catch it. Drop this once
    # litellm accepts filelock 4.
    ignore:
      - dependency-name: "filelock"
        update-types: ["version-update:semver-major"]
    # Group minor/patch version bumps AND all security updates into single PRs.
    # The `security` CI job scans the whole uv.lock, so bundling security
    # updates lets one PR clear every advisory at once instead of each
    # individual bump failing on the others still being vulnerable.
    #
    # Grouping alone is NOT sufficient, and it is worth knowing why before
    # relying on it: dependabot batches advisories surfaced in the same run, so
    # alerts arriving at different times still open separate PRs. aiohttp (#38)
    # and cryptography (#39) came in 7 hours apart across a day boundary and
    # deadlocked each other for two weeks, exactly as #25/#26/#27 had before.
    # The actual fix is in CI: pull requests are now scanned against the base
    # branch, so a PR only has to avoid introducing advisories rather than
    # clear every open one. See .github/scripts/security-scan.sh.
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      security:
        applies-to: security-updates
        patterns:
          - "*"
